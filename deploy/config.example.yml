# Mastarr declarative configuration.
#
# Optional — everything here can equally be done in the UI. Use this when you want the
# whole Mastarr setup version-controlled and reproducible.
#
# Enable by mounting the file and setting MASTARR_CONFIG_FILE=/config/config.yml
#
# Precedence: environment variables > this file > built-in defaults.
#
# Services declared here are reconciled into the database on every startup and marked
# read-only in the UI, because a UI edit would be silently reverted on the next restart.

# --------------------------------------------------------------------- general
log_level: INFO
http_timeout: 10.0
session_hours: 12

# Hosts the discovery scan probes when no host is given in the UI.
discovery_hosts:
  - 192.168.1.250

# -------------------------------------------------------------------- services
#
# `type` must be a registered adapter type: sonarr, radarr, prowlarr.
#
# Prefer `api_key_env` over `api_key` — it names an environment variable to read the key
# from, so this file stays free of credentials and safe to commit. Keys are encrypted at
# rest once loaded, and never written to logs.

services:
  - name: Sonarr
    type: sonarr
    url: http://192.168.1.250:8989
    api_key_env: SONARR_API_KEY
    enabled: true

  - name: Radarr
    type: radarr
    url: http://192.168.1.250:7878
    api_key_env: RADARR_API_KEY
    enabled: true

  # Prowlarr speaks API v1 rather than v3 — Mastarr handles that per adapter, so nothing
  # special is needed here.
  - name: Prowlarr
    type: prowlarr
    url: http://192.168.1.250:9696
    api_key_env: PROWLARR_API_KEY
    enabled: true

  # Inline keys work but are discouraged — this file usually ends up in git.
  # - name: Sonarr 4K
  #   type: sonarr
  #   url: http://192.168.1.250:8990
  #   api_key: "0123456789abcdef0123456789abcdef"
